<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="15" fill="#6B8E4E"/>
  <!-- Hyphal H: two stems joined by a branching mycelial crossbar -->
  <g stroke="#F6F2EA" stroke-width="5" stroke-linecap="round">
    <path d="M20 16 V48"/>
    <path d="M44 16 V48"/>
    <path d="M20 32 H44"/>
  </g>
  <g fill="#F6F2EA">
    <circle cx="20" cy="16" r="4.4"/>
    <circle cx="44" cy="16" r="4.4"/>
    <circle cx="20" cy="48" r="4.4"/>
    <circle cx="44" cy="48" r="4.4"/>
    <circle cx="32" cy="32" r="4"/>
  </g>
  <!-- small spore nodes off the crossbar -->
  <g stroke="#C77D4A" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 32 l7 -6"/>
    <path d="M32 32 l-7 6"/>
  </g>
  <g fill="#C77D4A">
    <circle cx="40" cy="25" r="2.4"/>
    <circle cx="24" cy="39" r="2.4"/>
  </g>
</svg>
