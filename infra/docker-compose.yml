services:
  hyphaehub:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: hyphaehub/community:latest
    ports:
      - "8080:8080"
    environment:
      # CHANGE THIS to a long random string before exposing the instance.
      BETTER_AUTH_SECRET: "change-me-to-a-long-random-secret"
      APP_URL: "http://localhost:8080"
      SITE_URL: "http://localhost:8080"
      # BETTER_AUTH_URL: "https://grow.example.com"   # set when behind a domain
    volumes:
      - hyphaehub-data:/data
    restart: unless-stopped

volumes:
  hyphaehub-data:
