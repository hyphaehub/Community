packages:
  - "apps/*"
  - "packages/*"

# Hoisted layout so React Native / Expo native build tooling (Metro + gradle
# bundling) finds modules at the workspace root, as its monorepo support expects.
nodeLinker: hoisted

# Pin React type defs to 18.3 workspace-wide so the Expo/React-Native subtree
# (which requires @types/react 18) doesn't clash with a hoisted v19.
overrides:
  "@types/react": "18.3.31"
  "@types/react-dom": "18.3.7"

allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  sharp: true
  workerd: true
